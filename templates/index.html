<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB HR Matchups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0a0e1a;
            --navy: #0f1628;
            --navy-light: #1a2240;
            --charcoal: #1c1c2e;
            --amber: #FFB800;
            --amber-dim: #cc9400;
            --amber-glow: rgba(255, 184, 0, 0.15);
            --red: #ff3b3b;
            --red-dim: rgba(255, 59, 59, 0.15);
            --green: #00e676;
            --green-dim: rgba(0, 230, 118, 0.15);
            --white: #f0f0f5;
            --gray: #8888a0;
            --gray-dark: #44445a;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Source Sans 3', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--navy-deep);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--navy-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--navy-light);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--amber-dim);
        }

        /* ── HEADER: Stadium Jumbotron ── */
        .jumbotron {
            position: relative;
            background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
            border-bottom: 4px solid var(--amber);
            padding: 0;
            overflow: hidden;
        }

        /* Diagonal stripe pattern */
        .jumbotron::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 20px,
                rgba(255, 184, 0, 0.02) 20px,
                rgba(255, 184, 0, 0.02) 40px
            );
            pointer-events: none;
        }

        /* Gradient mesh glow */
        .jumbotron::after {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(ellipse, var(--amber-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .jumbotron-inner {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px 30px;
        }

        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .site-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 5.5rem);
            letter-spacing: 4px;
            line-height: 1;
            color: var(--white);
            text-transform: uppercase;
        }

        .site-title .accent {
            color: var(--amber);
            text-shadow: 0 0 30px rgba(255, 184, 0, 0.4);
        }

        .site-subtitle {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            margin-top: 8px;
        }

        /* Date selector — scoreboard style */
        .date-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .date-label {
            font-family: var(--font-display);
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--amber);
        }

        .date-input {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 700;
            padding: 10px 16px;
            background: var(--navy-light);
            border: 2px solid var(--gray-dark);
            border-radius: 6px;
            color: var(--white);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 12px var(--amber-glow);
        }

        /* ── MAIN CONTAINER ── */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        /* ── TOP MATCHUPS: Leaderboard ── */
        .top-matchups-section {
            margin-bottom: 40px;
            animation: fadeSlideUp 0.5s ease both;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--navy-light);
        }

        .section-icon {
            font-size: 1.5rem;
            color: var(--amber);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .top-matchups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 16px;
        }

        .top-matchup-card {
            position: relative;
            background: var(--navy);
            border: 1px solid var(--navy-light);
            border-left: 4px solid var(--amber);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            overflow: hidden;
        }

        .top-matchup-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .top-matchup-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            border-color: var(--amber);
        }

        .top-matchup-card.rank-1 {
            border-left-width: 6px;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
        }

        .top-matchup-rank {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--gray-dark);
            line-height: 1;
            margin-bottom: 8px;
        }

        .rank-1 .top-matchup-rank {
            color: var(--amber);
            text-shadow: 0 0 20px rgba(255, 184, 0, 0.3);
        }

        .top-matchup-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-matchup-photo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--navy-light);
            flex-shrink: 0;
        }

        .rank-1 .top-matchup-photo {
            border-color: var(--amber);
        }

        .top-matchup-info {
            flex: 1;
            min-width: 0;
        }

        .top-matchup-name {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-matchup-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .top-matchup-team {
            font-size: 0.85rem;
            color: var(--gray);
            font-weight: 600;
        }

        .position-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--navy-deep);
            background: var(--amber);
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .top-matchup-stats {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .stat-block {
            text-align: center;
        }

        .stat-block .val {
            font-family: var(--font-display);
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .stat-block .lbl {
            font-size: 0.65rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-block .val.score {
            color: var(--green);
        }

        .stat-block .val.hr {
            color: var(--amber);
        }

        .stat-block .val.avg {
            color: var(--white);
        }

        /* ── GAME CARDS: Scoreboard tiles ── */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .game-card {
            position: relative;
            background: var(--navy);
            border: 1px solid var(--navy-light);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            border-color: var(--amber);
        }

        .game-card-teams {
            position: relative;
            padding: 24px 20px;
            background: var(--navy-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Diagonal accent line */
        .game-card-teams::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
        }

        .game-card-team {
            text-align: center;
            flex: 1;
        }

        .game-card-team-logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 8px;
        }

        .game-card-team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .game-card-team-name {
            font-family: var(--font-display);
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--white);
        }

        .game-card-team-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gray);
            margin-top: 2px;
        }

        .game-card-vs {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--amber);
            padding: 0 20px;
        }

        .game-card-details {
            padding: 16px 20px;
        }

        .game-card-pitchers {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .game-card-pitcher {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .game-card-pitcher:last-child {
            justify-content: flex-end;
        }

        .game-card-pitcher-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--navy-light);
        }

        .game-card-pitcher-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--white);
        }

        .game-card-pitcher-tbd {
            color: var(--gray-dark);
            font-style: italic;
            font-size: 0.85rem;
        }

        .game-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .game-card-venue {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .park-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 8px;
            font-family: var(--font-display);
            letter-spacing: 1px;
        }

        .park-hr-friendly {
            background: var(--green-dim);
            color: var(--green);
        }

        .park-pitcher-friendly {
            background: var(--red-dim);
            color: var(--red);
        }

        .park-neutral {
            background: var(--navy-light);
            color: var(--gray);
        }

        .game-card-time {
            color: var(--amber);
            font-weight: 700;
            white-space: nowrap;
            margin-left: 10px;
            font-family: var(--font-display);
            letter-spacing: 1px;
        }

        /* ── DETAIL VIEW ── */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--navy-light);
            border: 1px solid var(--gray-dark);
            border-radius: 6px;
            color: var(--gray);
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .back-button:hover {
            background: var(--amber);
            border-color: var(--amber);
            color: var(--navy-deep);
        }

        .game-section {
            background: var(--navy);
            border: 1px solid var(--navy-light);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .game-header {
            position: relative;
            background: var(--navy-light);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .game-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--amber);
        }

        .game-teams {
            font-family: var(--font-display);
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .game-info {
            color: var(--gray);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pitcher-info-toggle {
            cursor: pointer;
            color: var(--amber);
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 2px;
            padding: 6px 14px;
            border: 1px solid var(--amber);
            border-radius: 4px;
            background: transparent;
            transition: all 0.2s;
        }

        .pitcher-info-toggle:hover {
            background: var(--amber);
            color: var(--navy-deep);
        }

        /* ── BATTER CARDS: Stat panels ── */
        .batter-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .batter-card {
            padding: 24px;
            border-right: 1px solid var(--navy-light);
        }

        .batter-card:last-child {
            border-right: none;
        }

        .batter-card-secondary {
            opacity: 0.9;
            border-top: 1px solid var(--navy-light);
            padding-top: 20px;
            margin-top: 20px;
        }

        .batter-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--navy-light);
        }

        .batter-card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gray);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .batter-header-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .batter-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--navy-light);
            flex-shrink: 0;
        }

        .batter-name-wrapper {
            position: relative;
            display: inline-block;
        }

        .batter-name {
            font-family: var(--font-display);
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--white);
        }

        .bat-side {
            display: inline-block;
            font-size: 0.7rem;
            color: var(--navy-deep);
            background: var(--gray);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }

        .platoon-badge {
            display: inline-block;
            font-size: 0.65rem;
            color: var(--navy-deep);
            background: var(--green);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hot-streak-badge {
            display: inline-block;
            font-size: 0.65rem;
            color: var(--navy-deep);
            background: #ff9f43;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .matchup-score {
            font-size: 0.75rem;
            color: var(--green);
            background: var(--green-dim);
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: 1px;
        }

        .batter-hr-count {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--amber);
            line-height: 1;
        }

        .batter-hr-label {
            font-size: 0.7rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: right;
        }

        .batter-stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 8px 12px;
            background: var(--navy-light);
            border-radius: 6px;
            min-width: 70px;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 1.3rem;
            letter-spacing: 1px;
            color: var(--white);
        }

        .stat-label {
            font-size: 0.6rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Batted ball section */
        .batted-ball-section {
            background: var(--navy-light);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .batted-ball-title {
            font-size: 0.7rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .batted-ball-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Pitch matchup rows */
        .vs-pitcher-section {
            margin-top: 16px;
        }

        .vs-pitcher-title {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--red);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .pitch-legend {
            font-size: 0.7rem;
            color: var(--gray);
            margin-bottom: 10px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .pitch-legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pitch-legend .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .pitch-legend .dot.green { background: var(--green); }
        .pitch-legend .dot.red { background: var(--red); }
        .pitch-legend .dot.gray { background: var(--gray); }

        .pitch-matchup-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            background: var(--navy-deep);
        }

        .pitch-matchup-row.strong {
            border-left: 4px solid var(--green);
        }

        .pitch-matchup-row.weak {
            border-left: 4px solid var(--red);
        }

        .pitch-matchup-row.neutral {
            border-left: 4px solid var(--gray);
        }

        .pitch-matchup-row.rare {
            opacity: 0.45;
            border-left: 4px solid var(--gray-dark);
        }

        .pitch-matchup-row.weak-spot {
            border-left: 4px solid var(--red);
            background: var(--red-dim);
        }

        .pitch-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--navy-deep);
            min-width: 80px;
            text-align: center;
            font-family: var(--font-display);
            letter-spacing: 1px;
        }

        .pitch-usage-bar {
            flex: 1;
            height: 18px;
            background: var(--navy-light);
            border-radius: 4px;
            overflow: hidden;
        }

        .pitch-usage-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .pitch-matchup-stats {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.75rem;
        }

        .pitch-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 44px;
        }

        .pitch-stat .val {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .pitch-stat .lbl {
            font-size: 0.55rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pitch-stat.avg .val { color: var(--white); }
        .pitch-stat.slg .val { color: var(--green); }
        .pitch-stat.whiff .val { color: #ff9f43; }
        .pitch-stat.k .val { color: var(--red); }
        .pitch-stat.pa .val { color: var(--gray); }

        .pitch-weak-stat {
            color: var(--red) !important;
            font-weight: 700;
        }

        .weak-spot-badge {
            display: inline-block;
            font-size: 0.6rem;
            color: var(--navy-deep);
            background: var(--red);
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tooltip */
        .batter-name-wrapper .recent-form-tooltip {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 100;
            background: var(--navy-light);
            border: 1px solid var(--gray-dark);
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 6px;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .batter-name-wrapper:hover .recent-form-tooltip {
            display: block;
        }

        .recent-form-tooltip .tooltip-title {
            font-size: 0.65rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .recent-form-tooltip .tooltip-stats {
            font-size: 0.85rem;
            color: var(--white);
        }

        .recent-form-tooltip .tooltip-stats .hr-val {
            color: var(--amber);
            font-weight: 700;
        }

        .recent-form-tooltip .tooltip-stats .avg-val {
            color: #ff9f43;
            font-weight: 700;
        }

        .recent-form-tooltip .tooltip-stats .slg-val {
            color: var(--green);
            font-weight: 700;
        }

        /* Pitch mix section */
        .pitch-mix-section {
            display: none;
            background: var(--navy-deep);
            padding: 24px;
            border-top: 1px solid var(--navy-light);
        }

        .pitch-mix-section.visible {
            display: block;
        }

        .pitch-mix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .pitcher-pitch-mix h4 {
            font-family: var(--font-display);
            color: var(--white);
            margin-bottom: 14px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .pitch-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .pitch-bar-container {
            flex: 1;
            height: 22px;
            background: var(--navy-light);
            border-radius: 4px;
            overflow: hidden;
        }

        .pitch-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .pitch-stats {
            font-size: 0.8rem;
            color: var(--gray);
            min-width: 120px;
            text-align: right;
        }

        .pitch-stats .speed {
            color: var(--amber);
            font-weight: 700;
        }

        .pitch-stats .hr-allowed {
            color: var(--red);
        }

        /* ── LOADING / EMPTY STATES ── */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 4px solid var(--navy-light);
            border-top-color: var(--amber);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 16px;
            color: var(--gray);
            font-size: 1rem;
        }

        .no-games, .no-data {
            text-align: center;
            padding: 80px 20px;
            color: var(--gray);
            font-size: 1.2rem;
        }

        .no-data {
            padding: 40px 20px;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeSlideUp 0.4s ease both;
        }

        .game-card:nth-child(1) { animation-delay: 0.05s; }
        .game-card:nth-child(2) { animation-delay: 0.1s; }
        .game-card:nth-child(3) { animation-delay: 0.15s; }
        .game-card:nth-child(4) { animation-delay: 0.2s; }
        .game-card:nth-child(5) { animation-delay: 0.25s; }
        .game-card:nth-child(6) { animation-delay: 0.3s; }

        .top-matchup-card:nth-child(1) { animation-delay: 0.05s; }
        .top-matchup-card:nth-child(2) { animation-delay: 0.1s; }
        .top-matchup-card:nth-child(3) { animation-delay: 0.15s; }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .game-grid {
                grid-template-columns: 1fr;
            }

            .batter-cards {
                grid-template-columns: 1fr;
            }

            .batter-card {
                border-right: none;
                border-bottom: 1px solid var(--navy-light);
            }

            .batter-card:last-child {
                border-bottom: none;
            }

            .pitch-mix-grid {
                grid-template-columns: 1fr;
            }

            .game-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .top-matchups-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .jumbotron-inner {
                padding: 24px 16px 20px;
            }

            .site-title {
                font-size: 2.5rem;
            }

            .main {
                padding: 16px;
            }

            .game-card-teams {
                padding: 16px;
            }

            .game-card-team-logo {
                width: 44px;
                height: 44px;
            }

            .game-card-team-name {
                font-size: 1.1rem;
            }

            .batter-stats-row {
                gap: 10px;
            }

            .stat-item {
                min-width: 60px;
                padding: 6px 8px;
            }

            .pitch-matchup-stats {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="jumbotron">
        <div class="jumbotron-inner">
            <div class="title-row">
                <h1 class="site-title">MLB <span class="accent">HR</span> Matchups</h1>
            </div>
            <p class="site-subtitle">Top HR batters vs opposing pitcher pitch mix</p>
            <div class="date-control">
                <span class="date-label">Date:</span>
                <input type="date" id="game-date" class="date-input" onchange="onDateChange(this.value)">
            </div>
        </div>
    </div>

    <div class="main">
        <div id="games-view" class="view active">
            <div id="games-loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading games...</p>
            </div>
            <div id="top-matchups-section" class="top-matchups-section" style="display: none;">
                <div class="section-header">
                    <span class="section-icon">&#9889;</span>
                    <span class="section-title">Top Matchups Today</span>
                </div>
                <div id="top-matchups-grid" class="top-matchups-grid"></div>
            </div>
            <div id="games-grid" class="game-grid"></div>
            <div id="no-games" class="no-games" style="display: none;">
                <p>No games scheduled for this date.</p>
                <p style="margin-top: 10px; font-size: 0.9rem; color: var(--gray-dark);">Try selecting a different date during the MLB season (April-October).</p>
            </div>
        </div>

        <div id="detail-view" class="view">
            <button class="back-button" onclick="showGamesView()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Games
            </button>
            <div id="detail-loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading matchup data...</p>
            </div>
            <div id="detail-content"></div>
        </div>
    </div>

    <script>
        let currentDate = null;
        let currentGames = [];
        const gameDataCache = {};
        let topMatchupsController = null;

        function init() {
            const savedDate = localStorage.getItem('mlb-matchups-date');
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const initialDate = savedDate || today;
            document.getElementById('game-date').value = initialDate;
            currentDate = initialDate;
            loadGames(initialDate);
        }

        function onDateChange(selectedDate) {
            currentDate = selectedDate;
            localStorage.setItem('mlb-matchups-date', selectedDate);
            if (topMatchupsController) {
                topMatchupsController.abort();
                topMatchupsController = null;
            }
            showGamesView();
            loadGames(selectedDate);
        }

        async function loadGames(date) {
            const loadingEl = document.getElementById('games-loading');
            const gridEl = document.getElementById('games-grid');
            const noGamesEl = document.getElementById('no-games');

            loadingEl.style.display = 'block';
            gridEl.innerHTML = '';
            noGamesEl.style.display = 'none';

            const topSectionEl = document.getElementById('top-matchups-section');
            const topGridEl = document.getElementById('top-matchups-grid');
            topSectionEl.style.display = 'none';
            topGridEl.innerHTML = '';

            if (topMatchupsController) {
                topMatchupsController.abort();
            }

            try {
                const scheduleRes = await fetch(`/api/schedule?game_date=${date}`);
                let games = [];
                if (scheduleRes.ok) {
                    const data = await scheduleRes.json();
                    games = data.games || [];
                }

                if (games.length === 0) {
                    loadingEl.style.display = 'none';
                    noGamesEl.style.display = 'block';
                    return;
                }

                games.forEach((game, idx) => {
                    const card = createGameCard(game, idx);
                    gridEl.appendChild(card);
                });
                currentGames = games;

                loadingEl.style.display = 'none';

                loadTopMatchupsInBackground(date);
            } catch (error) {
                loadingEl.style.display = 'none';
                noGamesEl.style.display = 'block';
                noGamesEl.innerHTML = '<p>Failed to load games. Please try again.</p>';
            }
        }

        async function loadTopMatchupsInBackground(date) {
            topMatchupsController = new AbortController();
            const topSectionEl = document.getElementById('top-matchups-section');
            const topGridEl = document.getElementById('top-matchups-grid');

            try {
                const matchupsRes = await fetch(`/api/top-matchups?game_date=${date}`, {
                    signal: topMatchupsController.signal
                });
                topMatchupsController = null;

                if (!matchupsRes.ok) return;

                const data = await matchupsRes.json();
                const topMatchups = data.top_matchups || [];

                if (topMatchups.length > 0 && document.getElementById('games-view').classList.contains('active')) {
                    renderTopMatchups(topMatchups);
                    topSectionEl.style.display = 'block';
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    topMatchupsController = null;
                }
            }
        }

        function renderTopMatchups(matchups) {
            const gridEl = document.getElementById('top-matchups-grid');
            gridEl.innerHTML = '';

            matchups.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = `top-matchup-card animate-in${idx === 0 ? ' rank-1' : ''}`;
                card.onclick = () => loadGameDetail(m.gamePk);

                const batter = m.batter;
                const hotStreakHtml = m.recent_form && m.recent_form.hr >= 2 ? '<span class="hot-streak-badge">Hot</span>' : '';
                card.innerHTML = `
                    <div class="top-matchup-rank">#${idx + 1}</div>
                    <div class="top-matchup-content">
                        <img class="top-matchup-photo" src="${batter.photo_url}" alt="${batter.full_name}" loading="lazy" onerror="this.src='https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/v1/people/${batter.player_id}/headshot/67/current'">
                        <div class="top-matchup-info">
                            <div class="top-matchup-name">${batter.full_name} ${hotStreakHtml}</div>
                            <div class="top-matchup-meta">
                                <span class="top-matchup-team">${m.team}</span>
                                <span class="position-badge">${batter.position}</span>
                            </div>
                            <div class="top-matchup-stats">
                                <div class="stat-block"><div class="val score">${m.matchup_score.toFixed(2)}</div><div class="lbl">Score</div></div>
                                <div class="stat-block"><div class="val hr">${batter.home_runs}</div><div class="lbl">HR</div></div>
                                <div class="stat-block"><div class="val avg">${batter.batting_avg.toFixed(3)}</div><div class="lbl">AVG</div></div>
                            </div>
                        </div>
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        function createGameCard(game, idx) {
            const card = document.createElement('div');
            card.className = 'game-card animate-in';
            card.style.animationDelay = `${idx * 0.05}s`;
            card.onclick = () => loadGameDetail(game.gamePk);

            const homePitcher = game.home_pitcher;
            const awayPitcher = game.away_pitcher;
            const parkFactor = game.park_factor;
            let parkClass = 'park-neutral';
            if (parkFactor > 1.05) parkClass = 'park-hr-friendly';
            else if (parkFactor < 0.95) parkClass = 'park-pitcher-friendly';

            const gameTime = game.game_time ? new Date(game.game_time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }) : '';

            card.innerHTML = `
                <div class="game-card-teams">
                    <div class="game-card-team">
                        <div class="game-card-team-logo"><img src="${game.away.logo}" alt="${game.away.name}" loading="lazy"></div>
                        <div class="game-card-team-name">${game.away.name}</div>
                        <div class="game-card-team-label">Away</div>
                    </div>
                    <div class="game-card-vs">VS</div>
                    <div class="game-card-team">
                        <div class="game-card-team-logo"><img src="${game.home.logo}" alt="${game.home.name}" loading="lazy"></div>
                        <div class="game-card-team-name">${game.home.name}</div>
                        <div class="game-card-team-label">Home</div>
                    </div>
                </div>
                <div class="game-card-details">
                    <div class="game-card-pitchers">
                        <div class="game-card-pitcher">
                            ${awayPitcher ? `<img class="game-card-pitcher-photo" src="${awayPitcher.photo}" alt="${awayPitcher.name}" loading="lazy" onerror="this.style.display='none'"><span class="game-card-pitcher-name">${awayPitcher.name}</span>` : '<span class="game-card-pitcher-tbd">TBD</span>'}
                        </div>
                        <div class="game-card-pitcher">
                            ${homePitcher ? `<img class="game-card-pitcher-photo" src="${homePitcher.photo}" alt="${homePitcher.name}" loading="lazy" onerror="this.style.display='none'"><span class="game-card-pitcher-name">${homePitcher.name}</span>` : '<span class="game-card-pitcher-tbd">TBD</span>'}
                        </div>
                    </div>
                    <div class="game-card-meta">
                        <div class="game-card-venue">
                            ${game.venue}
                            <span class="park-badge ${parkClass}">${parkFactor.toFixed(2)}</span>
                        </div>
                        ${gameTime ? `<div class="game-card-time">${gameTime}</div>` : ''}
                    </div>
                </div>
            `;

            return card;
        }

        async function loadGameDetail(gamePk) {
            if (topMatchupsController) {
                topMatchupsController.abort();
                topMatchupsController = null;
            }

            showDetailView();

            const loadingEl = document.getElementById('detail-loading');
            const contentEl = document.getElementById('detail-content');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            const cacheKey = `${gamePk}-${currentDate}`;
            if (gameDataCache[cacheKey]) {
                loadingEl.style.display = 'none';
                renderGameDetail(gameDataCache[cacheKey]);
                return;
            }

            try {
                const response = await fetch(`/api/game/${gamePk}?game_date=${currentDate}`);
                const data = await response.json();
                loadingEl.style.display = 'none';

                if (data.error) {
                    contentEl.innerHTML = `<div class="no-data">${data.error}</div>`;
                    return;
                }

                gameDataCache[cacheKey] = data;
                renderGameDetail(data);
            } catch (error) {
                loadingEl.style.display = 'none';
                contentEl.innerHTML = '<div class="no-data">Failed to load matchup data. Please try again.</div>';
            }
        }

        function renderGameDetail(gameInfo) {
            const contentEl = document.getElementById('detail-content');

            const parkFactor = gameInfo.park_factor;
            let parkClass = 'park-neutral';
            if (parkFactor > 1.05) parkClass = 'park-hr-friendly';
            else if (parkFactor < 0.95) parkClass = 'park-pitcher-friendly';

            const awayBattersHtml = renderBatterSide(gameInfo.away_top_batters, 'Away', gameInfo.home_pitcher);
            const homeBattersHtml = renderBatterSide(gameInfo.home_top_batters, 'Home', gameInfo.away_pitcher);

            contentEl.innerHTML = `
                <div class="game-section">
                    <div class="game-header">
                        <div class="game-teams">${gameInfo.away_team} @ ${gameInfo.home_team}</div>
                        <div class="game-info">
                            ${gameInfo.venue}
                            <span class="park-badge ${parkClass}">${parkFactor.toFixed(2)}</span>
                            <button class="pitcher-info-toggle" onclick="togglePitchMix(this)">Pitch Mix</button>
                        </div>
                    </div>

                    <div class="batter-cards">
                        <div class="batter-card">${awayBattersHtml}</div>
                        <div class="batter-card">${homeBattersHtml}</div>
                    </div>

                    <div class="pitch-mix-section">
                        <div class="pitch-mix-grid">
                            <div class="pitcher-pitch-mix" data-pitcher-id="${gameInfo.home_pitcher?.pitcher_id || ''}" data-splits='${JSON.stringify(gameInfo.home_pitcher?.handedness_splits || {})}'>
                                <h4>${gameInfo.home_pitcher ? `${gameInfo.home_pitcher.full_name} (${gameInfo.home_team})` : `${gameInfo.home_team} Pitcher: TBD`}</h4>
                                <div class="pitch-mix-loading"><div class="spinner"></div><p style="margin-top: 10px; color: var(--gray);">Loading pitch data...</p></div>
                            </div>
                            <div class="pitcher-pitch-mix" data-pitcher-id="${gameInfo.away_pitcher?.pitcher_id || ''}" data-splits='${JSON.stringify(gameInfo.away_pitcher?.handedness_splits || {})}'>
                                <h4>${gameInfo.away_pitcher ? `${gameInfo.away_pitcher.full_name} (${gameInfo.away_team})` : `${gameInfo.away_team} Pitcher: TBD`}</h4>
                                <div class="pitch-mix-loading"><div class="spinner"></div><p style="margin-top: 10px; color: var(--gray);">Loading pitch data...</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBatterSide(batters, side, opposingPitcher) {
            if (!batters || batters.length === 0) {
                return '<div class="no-data">No batter data available</div>';
            }

            let html = '';
            batters.forEach((batter, idx) => {
                const rank = idx + 1;
                const label = `#${rank} ${side} Batter`;

                if (idx > 0) html += '<div class="batter-card-secondary">';

                const pitchBreakdownHtml = batter.vs_pitch_breakdown && opposingPitcher ? renderPitchBreakdown(batter.vs_pitch_breakdown, opposingPitcher, idx) : '';
                const hotStreakHtml = batter.recent_form && batter.recent_form.hr >= 2 ? '<span class="hot-streak-badge">Hot</span>' : '';

                html += `
                    <div class="batter-card-header">
                        <div>
                            <div class="batter-card-label">${label}</div>
                            <div>
                                <div class="batter-header-content">
                                    <img class="batter-photo" src="${batter.batter.photo_url}" alt="${batter.batter.full_name}" loading="lazy" onerror="this.style.display='none'">
                                    <span class="batter-name-wrapper">
                                        <span class="batter-name">${batter.batter.full_name}</span>
                                        <span class="bat-side">${batter.bat_side}</span>
                                        ${batter.platoon_advantage ? '<span class="platoon-badge">Platoon Advantage</span>' : ''}
                                        ${hotStreakHtml}
                                        <span class="recent-form-tooltip">
                                            <div class="tooltip-title">Last 14 Days</div>
                                            <div class="tooltip-stats">
                                                <span class="hr-val">${batter.recent_form.hr} HR</span> |
                                                <span class="avg-val">${batter.recent_form.avg.toFixed(3)} AVG</span> |
                                                <span class="slg-val">${batter.recent_form.slg.toFixed(3)} SLG</span> |
                                                ${batter.recent_form.games} G
                                            </div>
                                        </span>
                                    </span>
                                    <span class="matchup-score">${batter.matchup_score.toFixed(3)} MATCHUP</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="batter-hr-count">${batter.batter.home_runs}</div>
                            <div class="batter-hr-label">HR</div>
                        </div>
                    </div>

                    <div class="batter-stats-row">
                        <div class="stat-item"><div class="stat-value">${batter.batter.batting_avg.toFixed(3)}</div><div class="stat-label">AVG</div></div>
                        <div class="stat-item"><div class="stat-value">${batter.batter.slugging_pct.toFixed(3)}</div><div class="stat-label">SLG</div></div>
                        <div class="stat-item"><div class="stat-value">${batter.batter.iso.toFixed(3)}</div><div class="stat-label">ISO</div></div>
                        <div class="stat-item"><div class="stat-value">${batter.batter.ops.toFixed(3)}</div><div class="stat-label">OPS</div></div>
                    </div>

                    ${renderBattedBallSection(batter)}
                    ${pitchBreakdownHtml}
                `;

                if (idx > 0) html += '</div>';
                if (idx < batters.length - 1) html += '<hr style="border: none; border-top: 1px solid var(--navy-light); margin: 20px 0;">';
            });

            return html;
        }

        function renderBattedBallSection(batter) {
            if (!batter.barrel_data && !batter.batted_ball_data) return '';

            let html = '<div class="batted-ball-section"><div class="batted-ball-title">Batted Ball Profile</div><div class="batted-ball-stats">';

            if (batter.barrel_data) {
                html += `
                    <div class="stat-item"><div class="stat-value">${batter.barrel_data.fb_pct}%</div><div class="stat-label">FB%</div></div>
                    <div class="stat-item"><div class="stat-value">${batter.barrel_data.brl_pct}%</div><div class="stat-label">Brl%</div></div>
                    <div class="stat-item"><div class="stat-value">${batter.barrel_data.barrels}</div><div class="stat-label">Barrels</div></div>
                    <div class="stat-item"><div class="stat-value">${batter.barrel_data.avg_hit_speed}</div><div class="stat-label">Avg EV</div></div>
                    <div class="stat-item"><div class="stat-value">${batter.barrel_data.sweet_spot_pct}%</div><div class="stat-label">SS%</div></div>
                `;
            }

            if (batter.batted_ball_data) {
                html += `<div class="stat-item"><div class="stat-value">${batter.batted_ball_data.pull_pct}%</div><div class="stat-label">Pull%</div></div>`;
            }

            html += '</div></div>';
            return html;
        }

        function renderPitchBreakdown(vsPitchBreakdown, opposingPitcher, batterIdx) {
            let html = `<div class="vs-pitcher-section">
                <div class="vs-pitcher-title">vs <span class="vs-pitcher-name">${opposingPitcher.full_name}</span> Pitches</div>`;

            if (batterIdx === 0) {
                html += `<div class="pitch-legend">
                    <span><span class="dot green"></span> Batter dominates (.450+ SLG)</span>
                    <span><span class="dot red"></span> Batter struggles (&lt;.300 SLG)</span>
                    <span><span class="dot gray"></span> Neutral</span>
                </div>`;
            }

            vsPitchBreakdown.forEach(pitch => {
                let rowClass = 'neutral';
                if (pitch.is_rare) rowClass = 'rare';
                else if (pitch.is_weak_spot) rowClass = 'weak-spot';
                else if (pitch.slg >= 0.450) rowClass = 'strong';
                else if (pitch.slg < 0.300) rowClass = 'weak';

                const rareBadge = pitch.is_rare ? ' <span style="font-size:0.6rem;color:var(--gray-dark);">(rare)</span>' : '';
                const weakSpotBadge = pitch.is_weak_spot ? '<span class="weak-spot-badge">Weak Spot</span>' : '';
                const hrAllowedHtml = pitch.is_weak_spot
                    ? `<div class="pitch-stat"><span class="val pitch-weak-stat">${pitch.pitcher_hr_allowed} HR</span><span class="lbl">Allowed</span></div>`
                    : '';

                html += `
                    <div class="pitch-matchup-row ${rowClass}">
                        <span class="pitch-badge" style="background: ${pitch.color}">${pitch.display_name}${weakSpotBadge}${rareBadge}</span>
                        <div class="pitch-usage-bar">
                            <div class="pitch-usage-fill" style="width: ${pitch.pitch_usage}%; background: ${pitch.color}"></div>
                        </div>
                        <div class="pitch-matchup-stats">
                            <div class="pitch-stat avg"><span class="val">${pitch.ba.toFixed(3)}</span><span class="lbl">AVG</span></div>
                            <div class="pitch-stat slg"><span class="val">${pitch.slg.toFixed(3)}</span><span class="lbl">SLG</span></div>
                            <div class="pitch-stat whiff"><span class="val">${pitch.whiff_pct.toFixed(1)}%</span><span class="lbl">Whiff</span></div>
                            <div class="pitch-stat k"><span class="val">${pitch.k_pct.toFixed(1)}%</span><span class="lbl">K</span></div>
                            <div class="pitch-stat pa"><span class="val">${pitch.pa}</span><span class="lbl">PA</span></div>
                            ${hrAllowedHtml}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        function showGamesView() {
            document.getElementById('games-view').classList.add('active');
            document.getElementById('detail-view').classList.remove('active');
        }

        function showDetailView() {
            document.getElementById('games-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
        }

        const pitchMixCache = {};

        function togglePitchMix(button) {
            const section = button.closest('.game-section').querySelector('.pitch-mix-section');
            if (section.classList.contains('visible')) {
                section.classList.remove('visible');
                button.textContent = 'Pitch Mix';
                return;
            }

            section.classList.add('visible');
            button.textContent = 'Hide Pitch Mix';

            const pitcherEls = section.querySelectorAll('.pitcher-pitch-mix');
            pitcherEls.forEach(el => {
                if (el.dataset.pitcherId && !el.dataset.loaded) {
                    loadPitchMix(el, el.dataset.pitcherId, el.dataset.splits);
                }
            });
        }

        async function loadPitchMix(container, pitcherId, splitsData) {
            if (pitchMixCache[pitcherId]) {
                renderPitchMix(container, pitchMixCache[pitcherId], splitsData);
                return;
            }

            container.dataset.splits = splitsData || '{}';

            try {
                const response = await fetch(`/api/pitch-mix/${pitcherId}`);
                const data = await response.json();
                pitchMixCache[pitcherId] = data.pitch_mix;
                renderPitchMix(container, data.pitch_mix, splitsData);
            } catch (error) {
                container.innerHTML = '<p style="color: var(--gray); font-size: 0.9rem;">Failed to load pitch data</p>';
            }
        }

        function renderPitchMix(container, pitches, splitsData) {
            container.dataset.loaded = 'true';
            const loading = container.querySelector('.pitch-mix-loading');
            if (loading) loading.remove();

            if (!pitches || pitches.length === 0) {
                container.innerHTML += '<p style="color: var(--gray); font-size: 0.9rem;">No pitch data available</p>';
                return;
            }

            pitches.forEach(pitch => {
                const row = document.createElement('div');
                row.className = 'pitch-row';
                const weakSpotBadge = pitch.is_weak_spot ? '<span class="weak-spot-badge">Weak Spot</span>' : '';
                const weakSpotClass = pitch.is_weak_spot ? ' style="border-left: 3px solid var(--red); background: var(--red-dim); padding-left: 8px;"' : '';
                const hrAllowedHtml = pitch.is_weak_spot
                    ? ` | <span class="hr-allowed">${pitch.hr_allowed} HR allowed | ${pitch.hr_rate}% HR rate | ${pitch.slg_against} SLG</span>`
                    : (pitch.hr_allowed > 0 ? ` | <span class="hr-allowed">${pitch.hr_allowed} HR</span>` : '');
                row.innerHTML = `
                    <span class="pitch-badge" style="background: ${pitch.color}">${pitch.display_name}</span>${weakSpotBadge}
                    <div class="pitch-bar-container"${weakSpotClass}>
                        <div class="pitch-bar" style="width: ${pitch.usage_pct}%; background: ${pitch.color}"></div>
                    </div>
                    <div class="pitch-stats">
                        <span class="speed">${pitch.usage_pct}%</span>
                        ${pitch.avg_speed ? ` | ${pitch.avg_speed} mph` : ''}
                        ${hrAllowedHtml}
                    </div>
                `;
                container.appendChild(row);
            });

            const splits = splitsData ? JSON.parse(splitsData) : {};
            if (splits && splits.L && splits.R) {
                const splitsDiv = document.createElement('div');
                splitsDiv.style.cssText = 'margin-top: 16px; padding: 12px; background: var(--navy-light); border-radius: 6px;';
                const weakLabel = splits.weak_side ? (splits.weak_side === 'L' ? 'LHB' : 'RHB') : 'None';
                splitsDiv.innerHTML = `
                    <div style="font-size: 0.7rem; color: var(--gray); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700;">HR by Batter Handedness</div>
                    <div style="display: flex; gap: 24px; font-size: 0.85rem; flex-wrap: wrap;">
                        <div>
                            <span style="color: #45b7d1; font-weight: 700;">vs LHB:</span>
                            <span style="color: var(--white);"> ${splits.L.hr} HR</span>
                            <span style="color: var(--gray);"> | ${splits.L.pa} PA</span>
                            <span style="color: var(--red);"> | ${splits.L.hr_rate}% HR</span>
                            <span style="color: var(--green);"> | ${splits.L.slg} SLG</span>
                        </div>
                        <div>
                            <span style="color: var(--red); font-weight: 700;">vs RHB:</span>
                            <span style="color: var(--white);"> ${splits.R.hr} HR</span>
                            <span style="color: var(--gray);"> | ${splits.R.pa} PA</span>
                            <span style="color: var(--red);"> | ${splits.R.hr_rate}% HR</span>
                            <span style="color: var(--green);"> | ${splits.R.slg} SLG</span>
                        </div>
                    </div>
                    ${splits.weak_side ? `<div style="margin-top: 10px; font-size: 0.75rem;"><span class="weak-spot-badge">Weak Side: ${weakLabel}</span></div>` : ''}
                `;
                container.appendChild(splitsDiv);
            }
        }

        init();
    </script>
</body>
</html>
